# =============================================================
#  Portfolio d'Allan Nicolas : site + API + base MySQL
#  Lancement : cp .env.example .env (puis le remplir)
#              docker compose up -d --build
#  Voir DEPLOIEMENT.md
# =============================================================

# Réglages communs aux trois services :
# - journaux limités à 3 fichiers de 10 Mo : des robots bavards ne peuvent
#   pas remplir le disque du serveur ;
# - aucun programme du conteneur ne peut gagner de droits (no-new-privileges).
x-commun: &commun
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # Base MySQL : les données vivent dans le volume « db-data »
  db:
    <<: *commun
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: portfolio
      MYSQL_USER: portfolio
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD à définir dans .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD à définir dans .env}
    # Les tables sont créées par l'API au démarrage (api/src/main/resources/schema.sql)
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  # API Spring Boot : jamais exposée directement, nginx la relaie
  api:
    <<: *commun
    build: ./api
    environment:
      DB_HOST: db
      DB_NAME: portfolio
      DB_USER: portfolio
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME à définir dans .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD à définir dans .env}
    depends_on:
      db:
        condition: service_healthy

  # Site : nginx sert Angular et relaie /api ; seul service publié
  web:
    <<: *commun
    build: ./front
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api

volumes:
  db-data:
