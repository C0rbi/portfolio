<!--
  Lumière sous la surface. Les caustiques sont les deux pseudo-éléments de
  l'hôte ; les rayons sont cinq bandes inclinées d'un même angle.
  Durées et décalages passés en ligne : pas de boucle Sass.
-->
<div class="rays">
  <span class="ray" style="left: 8%; width: 90px; animation-duration: 8s; animation-delay: -2s"></span>
  <span class="ray" style="left: 24%; width: 60px; animation-duration: 10s; animation-delay: -6s"></span>
  <span class="ray" style="left: 47%; width: 140px; animation-duration: 11s; animation-delay: -1s"></span>
  <span class="ray" style="left: 66%; width: 70px; animation-duration: 7s; animation-delay: -4s"></span>
  <span class="ray" style="left: 85%; width: 110px; animation-duration: 9s; animation-delay: -7s"></span>
</div>
