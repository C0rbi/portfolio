<!--
  Intermède « tortue verte » (Chelonia mydas), vue de dessus, comme sur
  une planche de carnet. Elle est dessinée tête à droite ; .mover--rev la
  retourne pour qu'elle traverse de droite à gauche.
-->
<div class="interlude__stage">
  <div class="mover mover--rev turtle">
    <span class="legend turtle__legend"><em>Chelonia mydas</em> · tortue verte</span>
    <div class="turtle__swim">
      <svg viewBox="0 0 160 110">
        <g stroke="var(--ink)" stroke-opacity=".5" stroke-width=".9" stroke-linejoin="round">
          <!-- Nageoires arrière, à demi-phase -->
          <g class="flipper flipper--hind" fill="var(--fx-turtle-skin)">
            <path d="M53 41C46 33 36 28 26 27c-3 0-4 2-2 4 6 6 14 12 22 15z" />
            <path d="M33 30.5c4 1 8 3 11 5.5" fill="none" stroke-opacity=".3" />
          </g>
          <g class="flipper flipper--hind flipper--low" fill="var(--fx-turtle-skin)">
            <path d="M53 69c-7 8-17 13-27 14-3 0-4-2-2-4 6-6 14-12 22-15z" />
            <path d="M33 79.5c4-1 8-3 11-5.5" fill="none" stroke-opacity=".3" />
          </g>

          <!-- Nageoires avant : longues pagaies rejetées vers l'arrière, une griffe -->
          <g class="flipper flipper--fore" fill="var(--fx-turtle-skin)">
            <path d="M113 36C112 23 101 10 80 3c-4-1-5 2-2 4 10 7 16 15 18 27z" />
            <path d="M106 23c-6-6-12-10-20-13M100 26c-3 3-4 5-4 8" fill="none" stroke-opacity=".3" />
            <path d="M98.8 14.6l3.6-3.4.2 4.6z" fill="var(--fx-turtle-dark)" stroke="none" />
          </g>
          <g class="flipper flipper--fore flipper--low" fill="var(--fx-turtle-skin)">
            <path d="M113 74c-1 13-12 26-33 33-4 1-5-2-2-4 10-7 16-15 18-27z" />
            <path d="M106 87c-6 6-12 10-20 13M100 84c-3-3-4-5-4-8" fill="none" stroke-opacity=".3" />
            <path d="M98.8 95.4l3.6 3.4.2-4.6z" fill="var(--fx-turtle-dark)" stroke="none" />
          </g>

          <!-- Queue et tête : écailles préfrontales, yeux sur les côtés -->
          <path d="M39 51l-8 4 8 4z" fill="var(--fx-turtle-skin)" />
          <path d="M116 49.5c5.6-2.6 12-3.8 17.6-2.8 5.6 1 9 4.4 9 8.3s-3.4 7.3-9 8.3c-5.6 1-12-.2-17.6-2.8z" fill="var(--fx-turtle-skin)" />
          <path d="M133 54.4l1.2-3.6 4.4.8 1.8 2.8zM133 55.6l1.2 3.6 4.4-.8 1.8-2.8zM126 52l5-1.6v9.2l-5-1.6z" fill="var(--fx-turtle-dark)" stroke="none" opacity=".55" />
          <circle cx="134" cy="48.6" r="1.5" fill="var(--ink)" stroke="none" />
          <circle cx="134" cy="61.4" r="1.5" fill="var(--ink)" stroke="none" />

          <!-- Carapace : écailles sombres, jointures claires -->
          <path d="M120 55c0-18-13-30-34-31-20-1-39 8-49 23-2.6 4-2.6 12 0 16 10 15 29 24 49 23 21-1 34-13 34-31z" fill="var(--fx-turtle)" />
          <g fill="var(--fx-turtle-dark)" stroke="none">
            <!-- Vertébrales -->
            <path d="M111 55l-6-8.6h-7.2v17.2h7.2zM95.8 46.4l-6.4-1.8-6.6 1.8v17.2l6.6 1.8 6.4-1.8zM80.8 46.4l-6.4-1.8-6.6 1.8v17.2l6.6 1.8 6.4-1.8zM65.8 46.4l-6-1.6-6 1.6v17.2l6 1.6 6-1.6zM51.8 46.6h-5.6l-5.4 8.4 5.4 8.4h5.6z" />
            <!-- Costales, décalées d'une demi-plaque comme sur l'animal -->
            <path d="M110.4 46.2l-6-1.6h-8.6l-4.3-1.4v-13c5.5.4 11.5 2.8 15.1 6.4 2.4 2.4 4 5.8 3.8 9.6zM89.5 43l-6.7 1.8h-2l-4.3-1.2v-14c4.1-.6 8.9-.7 13-.2zM74.5 43l-6.7 1.8h-2l-4.3-1.2V33.2c3.9-1.8 8.3-3 13-3.4zM59.5 43.2l-5.7 1.6h-7.6l-2.8 4c1.6-4.8 5.6-9.8 10.2-12.4 2-1.2 3.8-1.8 5.9-2.4z" />
            <path d="M110.4 63.8l-6 1.6h-8.6l-4.3 1.4v13c5.5-.4 11.5-2.8 15.1-6.4 2.4-2.4 4-5.8 3.8-9.6zM89.5 67l-6.7-1.8h-2l-4.3 1.2v14c4.1.6 8.9.7 13 .2zM74.5 67l-6.7-1.8h-2l-4.3 1.2v10.4c3.9 1.8 8.3 3 13 3.4zM59.5 66.8l-5.7-1.6h-7.6l-2.8-4c1.6 4.8 5.6 9.8 10.2 12.4 2 1.2 3.8 1.8 5.9 2.4z" />
          </g>
          <!-- Marginales : de simples traits sur le pourtour -->
          <path
            d="M117.6 42.7l-5 1.9M110.9 33.1l-4.3 3.7M100.2 26.7l-2.6 4.3M86 24v5M71.3 25.1l.7 4.9M57.7 29.5l2.3 4.5M46 36.9l4 3.6M117.6 67.3l-5-1.9M110.9 76.9l-4.3-3.7M100.2 83.3l-2.6-4.3M86 86v-5M71.3 84.9l.7-4.9M57.7 80.5l2.3-4.5M46 73.1l4-3.6M120 55h-5"
            fill="none"
            stroke="var(--fx-turtle-dark)"
            stroke-opacity="1"
          />
          <!-- Lumière venue de la surface -->
          <path d="M108 34C99 27 82 24.6 64 28.6c17-1.4 32 .4 44 5.4z" fill="#fff" fill-opacity=".3" stroke="none" />
        </g>
      </svg>
    </div>
  </div>

  <!-- Colonne de bulles au bord droit. --rb : place en mouvement réduit -->
  <span class="bubble" style="--x: 92%; --s: 8px; --d: 6s; --delay: -1s; --dx: -6px; --rb: 18%"></span>
  <span class="bubble" style="--x: 92.6%; --s: 6px; --d: 5s; --delay: -3.4s; --dx: 5px; --rb: 46%"></span>
  <span class="bubble" style="--x: 91.4%; --s: 12px; --d: 8s; --delay: -5s; --dx: -4px; --rb: 62%"></span>
  <span class="bubble" style="--x: 92.2%; --s: 7px; --d: 7s; --delay: -.2s; --dx: 7px; --rb: 80%"></span>
</div>
