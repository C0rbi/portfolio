<!--
  Rivage : du sable sec (en haut) à l'eau du lagon (en bas).
  Couches, de la plus basse à la plus haute : laisse de mer, sable mouillé,
  dernières traces de pas, puis l'eau (nappe, bande d'écume, vague suivante)
  et l'étiquette de profondeur.
  Les SVG pleine largeur ne s'animent qu'en bloc : leurs couches font 200 %
  de large (400 % sur mobile), se répètent à mi-longueur et glissent d'une
  demi-largeur (wave-loop).
  Aucune référence #id : ce décor sert aussi sur la fiche projet.
-->

</svg>

<!-- Sable mouillé : il fonce juste après le retrait de chaque vague -->
<div class="shore__wet"></div>
