<!--
  Côte vue depuis la plage : horizon, récif, îlot Amédée et son phare,
  lagon, pirogue, rivage, sable et cocotier. Tout est décoratif
  (aria-hidden par partie), sauf le bouton du phare et son message.
-->
<div class="coast__scene" [class.is-lit]="lit()" [class.is-calm]="motion.calm()">
  <div class="coast__bands" aria-hidden="true"></div>
  <div class="coast__veil" aria-hidden="true"></div>

  <!-- Soleil, posé sur l'horizon : un disque et son halo qui respire -->
  <div class="coast__sun" aria-hidden="true">
    <svg class="sun__disc" viewBox="0 0 200 200">
      <circle class="sun__halo" cx="100" cy="100" r="64" style="fill: var(--sun-glow)" />
      <circle cx="100" cy="100" r="46" style="fill: var(--sun)" />
    </svg>
  </div>

  </div>

    <span style="top: 39%; left: 22%; width: 26px; --gd: 4.2s"></span>

    <span style="top: 51%; left: 38%; width: 28px; --gd: 5.1s; animation-delay: -4s"></span>
  </div>
