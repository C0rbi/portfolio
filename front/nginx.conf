# Site Angular + relais de /api vers le conteneur « api » du docker-compose

# Protocole d'origine : celui qu'annonce le proxy HTTPS placé devant, s'il y
# en a un, sinon celui de la connexion. L'API marque ainsi son cookie de
# session « Secure » quand le site est servi en HTTPS.
map $http_x_forwarded_proto $proto_origine {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

# HSTS (voir securite.conf) : seulement quand le site est servi en HTTPS
map $proto_origine $hsts {
  https   "max-age=31536000";
  default "";
}

# Contre les robots, par adresse IP : 5 requêtes par seconde vers l'API
# (rafale de 20 tolérée), et 30 connexions simultanées au plus
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=connexions:10m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Ni version de nginx dans les réponses, ni journal des visites : les
  # adresses IP ne sont pas conservées (voir les mentions légales). Les
  # requêtes refusées par les limites ne sont pas journalisées non plus.
  server_tokens off;
  access_log off;
  limit_req_log_level info;
  limit_conn_log_level info;

  # Connexions trop lentes ou trop nombreuses : on coupe court
  client_header_timeout 15s;
  client_body_timeout 15s;
  keepalive_timeout 30s;
  send_timeout 15s;
  limit_conn connexions 30;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/snippets/securite.conf;

  # Si un autre proxy est placé devant (HTTPS, tunnel…), l'adresse du
  # visiteur est lue dans l'en-tête X-Forwarded-For qu'il transmet. Seules
  # les connexions venant d'un réseau privé (ce proxy) sont crues.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Le nom « api » est résolu à chaque requête par le DNS de Docker : le
  # site s'affiche même si l'API n'a pas encore démarré.
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $api http://api:8080;

  # API Spring Boot (^~ : aucune autre règle ne s'applique à /api/).
  # X-Forwarded-For est écrasé (et non complété) : l'API reçoit une seule
  # adresse, celle retenue ci-dessus.
  location ^~ /api/ {
    limit_req zone=api burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 32k;

    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $proto_origine;

    # Messages et session : jamais gardés en cache
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/securite.conf;
  }

  # Fichiers cachés (.env, .git…) : il n'y en a pas ici, on répond 404
  # au lieu de renvoyer la page d'accueil aux robots qui les cherchent
  location ~ /\.(?!well-known/) {
    return 404;
  }

  # Fichiers du build avec empreinte dans le nom (main-AB12CD34.js…) :
  # leur contenu ne change jamais, cache long. Guillemets obligatoires :
  # sans eux, nginx prendrait l'accolade de {8} pour un début de bloc.
  location ~* "-[a-z0-9]{8}\.(?:js|css)$" {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/securite.conf;
    try_files $uri =404;
  }

  # index.html est revalidé à chaque visite : après une mise à jour, les
  # visiteurs reçoivent tout de suite la nouvelle version.
  location = /index.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/securite.conf;
  }

  # Application Angular : toute route du site renvoie index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
