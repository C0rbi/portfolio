# Site Angular + relais de /api vers le conteneur « api » du docker-compose
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Si un autre proxy est placé devant (HTTPS, tunnel…), l'adresse du
  # visiteur est lue dans l'en-tête X-Forwarded-For qu'il transmet. Seules
  # les connexions venant d'un réseau privé (ce proxy) sont crues.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Le nom « api » est résolu à chaque requête par le DNS de Docker : le
  # site s'affiche même si l'API n'a pas encore démarré.
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $api http://api:8080;

  # API Spring Boot. X-Forwarded-For est écrasé (et non complété) : l'API
  # reçoit une seule adresse, celle retenue ci-dessus.
  location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 32k;
  }

  # Fichiers du build avec empreinte dans le nom : cache long
  location ~* \.(?:js|css|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html est revalidé à chaque visite : après une mise à jour, les
  # visiteurs reçoivent tout de suite la nouvelle version.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Application Angular : toute route du site renvoie index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
