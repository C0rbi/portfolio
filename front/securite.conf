# En-têtes de sécurité, inclus dans le bloc server ET dans chaque location
# qui a ses propres add_header : nginx ne les hérite pas dans ce cas.

# CSP : le navigateur ne charge que ce que le site sert lui-même, plus les
# polices Google. Aucun script en ligne ni venu d'ailleurs ; aucune page
# ne peut afficher le site dans un cadre (contre le « clickjacking »).
# 'unsafe-inline' reste permis pour les styles : Angular insère ceux des
# composants dans des balises <style>.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# HTTPS obligatoire pendant un an, mais seulement si le site est déjà servi
# en HTTPS (variable $hsts vide sinon : l'en-tête n'est pas envoyé)
add_header Strict-Transport-Security $hsts always;
