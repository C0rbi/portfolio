spring.application.name=portfolio-api
server.port=8080

# Derrière nginx : l'adresse du visiteur arrive dans X-Forwarded-For
# (nginx l'écrase, elle ne peut donc pas être falsifiée par le visiteur)
server.forward-headers-strategy=native

# Base MySQL : les valeurs viennent du docker-compose (fichier .env)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:portfolio}
spring.datasource.username=${DB_USER:portfolio}
spring.datasource.password=${DB_PASSWORD:}

# Le schéma est créé par db/init.sql : Hibernate n'y touche pas
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Jeton de la page /admin (vide = lecture des messages impossible)
portfolio.admin-token=${ADMIN_TOKEN:}

# Anti-rafale : au plus 5 messages par adresse IP toutes les 10 minutes
portfolio.limite.envois=5
portfolio.limite.fenetre=PT10M
