spring.application.name=portfolio-api
server.port=8080

# Derrière nginx : l'adresse du visiteur arrive dans X-Forwarded-For (nginx
# l'écrase, le visiteur ne peut pas la falsifier), et le protocole d'origine
# (http ou https) dans X-Forwarded-Proto
server.forward-headers-strategy=native

# Base MySQL : les valeurs viennent du docker-compose (fichier .env)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:portfolio}
spring.datasource.username=${DB_USER:portfolio}
spring.datasource.password=${DB_PASSWORD:}

# Schéma : schema.sql, rejoué à chaque démarrage (CREATE TABLE IF NOT EXISTS).
# Hibernate, lui, ne touche pas aux tables.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Compte de la page /admin, aligné sur le .env à chaque démarrage
# (voir CompteAdminInitial)
portfolio.admin.identifiant=${ADMIN_USERNAME:}
portfolio.admin.mot-de-passe=${ADMIN_PASSWORD:}

# Session de la page /admin : cookie HttpOnly (par défaut), jamais envoyé
# depuis un autre site (SameSite=Strict), et marqué Secure par Tomcat quand
# le site est servi en HTTPS. Fermée après 2 h d'inactivité.
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=2h

# Anti-rafale, par adresse IP : 5 messages toutes les 10 minutes, et
# 10 tentatives de connexion toutes les 15 minutes
portfolio.limite.envois=5
portfolio.limite.fenetre=PT10M
portfolio.limite.connexions=10
portfolio.limite.connexions-fenetre=PT15M

# Boîte de réception : au-delà de 500 messages non lus, les nouveaux sont
# refusés (contre un envoi massif de robots qui remplirait le disque)
portfolio.messages.max-non-lus=500
